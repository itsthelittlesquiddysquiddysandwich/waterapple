<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>waterapple</title>
  <!-- Water droplet favicon for the browser tab -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 64 64'><text y='52' font-size='52'>💧</text></svg>">
  <!-- Cursive script font -->
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Main Home Screen */
    #home-view {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .droplet-logo {
      font-size: 2.8rem;
      line-height: 1;
      user-select: none;
    }

    .logo {
      font-family: 'Pacifico', cursive;
      font-size: 3.4rem;
      color: #ffffff;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .description {
      color: #888888;
      font-size: 0.95rem;
      max-width: 460px;
      line-height: 1.5;
    }

    /* Search / URL Bar */
    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      background-color: #111111;
      border: 1px solid #262626;
      border-radius: 18px;
      padding: 16px 20px;
      gap: 14px;
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: #555555;
    }

    .search-box svg {
      width: 20px;
      height: 20px;
      stroke: #777777;
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 1.05rem;
    }

    .search-box input::placeholder {
      color: #777777;
    }

    /* Shortcut Tiles Grid */
    .shortcuts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 560px;
    }

    .tile {
      background-color: #0d0d0d;
      border: 1px solid #1f1f1f;
      border-radius: 16px;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
      text-decoration: none;
      color: #ffffff;
    }

    .tile:hover {
      background-color: #161616;
      border-color: #333333;
      transform: translateY(-2px);
    }

    .tile-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .tile span {
      font-size: 0.85rem;
      font-weight: 500;
      color: #e5e5e5;
    }

    /* Games Drawer */
    #games-section {
      display: none;
      width: 100%;
      max-width: 560px;
      background-color: #0d0d0d;
      border: 1px solid #1f1f1f;
      border-radius: 16px;
      padding: 18px;
      gap: 12px;
      flex-direction: column;
    }

    #games-section.active {
      display: flex;
    }

    .games-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #999999;
      margin-bottom: 4px;
    }

    .games-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .game-btn {
      background-color: #161616;
      border: 1px solid #262626;
      color: #ffffff;
      padding: 12px;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.15s;
    }

    .game-btn:hover {
      background-color: #222222;
    }

    /* Built-in Fullscreen Viewer */
    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #000000;
      flex-direction: column;
      z-index: 100;
    }

    #viewer.active {
      display: flex;
    }

    .viewer-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background-color: #111111;
      border-bottom: 1px solid #222222;
    }

    .viewer-btn {
      background-color: #1f1f1f;
      border: 1px solid #333333;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .viewer-btn:hover {
      background-color: #2c2c2c;
    }

    .viewer-url {
      flex: 1;
      background-color: #0a0a0a;
      border: 1px solid #262626;
      color: #cccccc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background-color: #ffffff;
    }

    @media (max-width: 520px) {
      .shortcuts {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Home Screen -->
  <div id="home-view">
    <div class="brand-header">
      <div class="brand-row">
        <span class="droplet-logo">💧🍎</span>
        <div class="logo">waterapple</div>
      </div>
      <p class="description">
        visit <span onclick="openSite('https://lnaxyd.sbs')" style="color: #38bdf8; cursor: pointer; text-decoration: underline;">lnaxyd.sbs</span> through the browser for more!
      </p>
    </div>

    <form class="search-box" id="search-form">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="url-input"
        placeholder="Search or enter a website URL..."
        autocomplete="off"
      />
    </form>

    <!-- 4 Shortcut Tiles -->
    <div class="shortcuts">
      <div class="tile" onclick="openSite('https://wikipedia.org')">
        <div class="tile-icon" style="background: #222; color: #fff;">W</div>
        <span>Wiki</span>
      </div>

      <div class="tile" onclick="openSite('https://mit.edu')">
        <div class="tile-icon" style="background: #1db954; color: #000;">♫</div>
        <span>Music</span>
      </div>

      <div class="tile" onclick="openSite('https://desmos.com')">
        <div class="tile-icon" style="background: #2563eb; color: #fff;">∑</div>
        <span>Tools</span>
      </div>

      <div class="tile" onclick="toggleGames()">
        <div class="tile-icon" style="background: #1a1a1a; border: 1px solid #333;">🎮</div>
        <span>Play</span>
      </div>
    </div>

    <!-- Expandable Games List -->
    <div id="games-section">
      <div class="games-header">
        <span>Quick Play (add your own html games too muhahaha)</span>
        <span style="cursor:pointer;" onclick="toggleGames()">✕</span>
      </div>
      <div class="games-list">
        <button class="game-btn" onclick="openSite('https://play2048.co')">2048</button>
        <button class="game-btn" onclick="openSite('https://hextris.io')">Hextris</button>
        <button class="game-btn" onclick="openSite('https://chromedino.com')">Dino Run</button>
        <button class="game-btn" onclick="openSite('https://scratch.mit.edu')">Scratch Games</button>
      </div>
    </div>
  </div>

  <!-- Built-in Fullscreen Viewer -->
  <div id="viewer">
    <div class="viewer-bar">
      <button class="viewer-btn" onclick="closeViewer()">← Home</button>
      <input type="text" class="viewer-url" id="viewer-address" onkeydown="if(event.key==='Enter') openSite(this.value)" />
      <button class="viewer-btn" onclick="reloadFrame()">↻</button>
      <button class="viewer-btn" onclick="openExternal()">↗ New Tab</button>
    </div>
    <iframe id="web-frame" src=""></iframe>
  </div>

  <script>
    const homeView = document.getElementById('home-view');
    const viewer = document.getElementById('viewer');
    const webFrame = document.getElementById('web-frame');
    const viewerAddress = document.getElementById('viewer-address');
    const urlInput = document.getElementById('url-input');
    const gamesSection = document.getElementById('games-section');

    function formatInput(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return null;
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
        return trimmed;
      }
      if (trimmed.includes('.') && !trimmed.includes(' ')) {
        return 'https://' + trimmed;
      }
      return 'https://google.com' + encodeURIComponent(trimmed);
    }

    document.getElementById('search-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const target = formatInput(urlInput.value);
      if (target) openSite(target);
    });

    function openSite(url) {
      // Load local HTML game files from your repo directly inside the built-in viewer
      if (!url.startsWith('http://') && !url.startsWith('https://') && !url.includes('.')) {
        webFrame.src = url;
        viewerAddress.value = url;
        homeView.style.display = 'none';
        viewer.classList.add('active');
        return;
      }

      const formatted = formatInput(url);
Use code with caution.
if (!formatted) return;
// Open external sites in an about:blank tab so X-Frame-Options doesn't block them
const win = window.open('about:blank', '_blank');
if (win) {
win.document.body.style.margin = '0';
win.document.body.style.height = '100vh';
const iframe = win.document.createElement('iframe');
iframe.style.border = 'none';
iframe.style.width = '100%';
iframe.style.height = '100%';
iframe.src = formatted;
win.document.body.appendChild(iframe);
} else {
window.open(formatted, '_blank');
}
}
function closeViewer() {
viewer.classList.remove('active');
homeView.style.display = 'flex';
webFrame.src = '';
}
function reloadFrame() {
webFrame.src = webFrame.src;
}
function openExternal() {
if (viewerAddress.value) {
window.open(viewerAddress.value, '_blank');
}
}
function toggleGames() {
gamesSection.classList.toggle('active');
}
